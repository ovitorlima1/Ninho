# Local development database. Start with `pnpm db:up`.
name: ninho-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: ninho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ninho
      POSTGRES_PASSWORD: ninho
      POSTGRES_DB: ninho
    ports:
      - "5460:5432"
    volumes:
      - ninho-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ninho -d ninho"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  ninho-pgdata:
